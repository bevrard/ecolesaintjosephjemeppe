					</div> <!-- Umbra Webticker / End -->

					<script>
						$(document).ready(function () {

							var webtickerCarousel = $('#Main-Carousel');
							webtickerCarousel.umbraWebticker({
								items: 4,
								itemWidth: 270,
								navigation: true,
								draggable: true,
								allowEmptySpace: false,
								navContainerClass: 'wtc-nav',
								navClasses: ['wtc-prev', 'wtc-next'],
								onHoverStop: true,
								duration: 500,
								slideAmount: 300,
								slidingMode: 'item',
								customModeClass: '',
								displayOneItem: false,
								autoplay: false,
								direction: 'left',
								interval: 5000,
								easing: 'cubic-bezier(.86,-0.24,.1,1.23)',
								width: '100%',
								startEmpty: 0,
								autoWidth: true,
								slidingFilter: true,
								tickerContainer: 'stage-container',
								tickerOuterClass: 'mask',
								tickerClass: 'stage',
								playReverse: false,
								itemElement: 'div',
								stageElement: 'div',
								animatePosition: true,
								rssUrl: '',
								feedLimit: 8,
								feedTmp: '',
								responsive: {
									items: [
										["425", 1],
										["600", 2],
										["1000", 3],
										["1170", 4],
									]
								},
								responsiveRefreshRate: 500,

								// Callbacks
								onWebtickerStart: function () {},
								onWebtickerStop: function () {},
								onWebtickerNext: function () {},
								onWebtickerPrev: function () {},
								onWebtickerResize: function () {},
								onWebtickerPause: function () {}
							});
